kind = "web"
previewPath = "/"
title = "Hệ thống Quản lý Đào tạo"
version = "1.0.0"
id = "artifacts/training-management"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21328

[services.development]
run = "pnpm --filter @workspace/training-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/training-management", "run", "build" ]
publicDir = "artifacts/training-management/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21328"
BASE_PATH = "/"
