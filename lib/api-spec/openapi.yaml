openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hệ thống Quản lý Đào tạo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courses
    description: Quản lý khóa học
  - name: classes
    description: Quản lý lớp học
  - name: sessions
    description: Quản lý buổi học
  - name: students
    description: Quản lý học viên
  - name: instructors
    description: Quản lý giảng viên
  - name: certificates
    description: Cấp chứng chỉ
  - name: dashboard
    description: Thống kê tổng quan
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Tổng quan thống kê
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: Danh sách khóa học
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [courses]
      summary: Tạo khóa học
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Chi tiết khóa học
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    put:
      operationId: updateCourse
      tags: [courses]
      summary: Cập nhật khóa học
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [courses]
      summary: Xóa khóa học
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: Danh sách lớp học
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: courseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassWithDetails"
    post:
      operationId: createClass
      tags: [classes]
      summary: Tạo lớp học
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassWithDetails"

  /classes/{id}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Chi tiết lớp học
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassWithDetails"
    put:
      operationId: updateClass
      tags: [classes]
      summary: Cập nhật lớp học
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassWithDetails"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Xóa lớp học
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /classes/{classId}/sessions:
    get:
      operationId: listClassSessions
      tags: [sessions]
      summary: Danh sách buổi học của lớp
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Tạo buổi học
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /classes/{classId}/sessions/{sessionId}:
    put:
      operationId: updateSession
      tags: [sessions]
      summary: Cập nhật buổi học
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Xóa buổi học
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /classes/{classId}/students:
    get:
      operationId: listClassStudents
      tags: [classes]
      summary: Danh sách học viên trong lớp
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of students in class
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassStudentDetail"
    put:
      operationId: bulkUpdateClassStudents
      tags: [classes]
      summary: Cập nhật kết quả hàng loạt học viên trong lớp
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateStudentsBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: Danh sách học viên
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: classId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentWithDetails"
    post:
      operationId: createStudent
      tags: [students]
      summary: Tạo học viên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentWithDetails"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Chi tiết học viên
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentWithDetails"
    put:
      operationId: updateStudent
      tags: [students]
      summary: Cập nhật học viên
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentWithDetails"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Xóa học viên
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /instructors:
    get:
      operationId: listInstructors
      tags: [instructors]
      summary: Danh sách giảng viên
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of instructors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instructor"
    post:
      operationId: createInstructor
      tags: [instructors]
      summary: Tạo giảng viên
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstructorBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"

  /instructors/{id}:
    get:
      operationId: getInstructor
      tags: [instructors]
      summary: Chi tiết giảng viên
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Instructor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"
    put:
      operationId: updateInstructor
      tags: [instructors]
      summary: Cập nhật giảng viên
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstructorBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"
    delete:
      operationId: deleteInstructor
      tags: [instructors]
      summary: Xóa giảng viên
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: Danh sách lớp để cấp chứng chỉ
      responses:
        "200":
          description: List of classes for certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassWithDetails"

  /certificates/{classId}/students:
    get:
      operationId: getCertificateStudentsByClass
      tags: [certificates]
      summary: Danh sách học viên với trạng thái chứng chỉ theo lớp
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Students with certificate status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificateStudentDetail"

  /certificates/{classId}:
    get:
      operationId: getCertificatesByClass
      tags: [certificates]
      summary: Danh sách chứng chỉ theo lớp
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Certificates list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificateRecord"
    post:
      operationId: issueCertificate
      tags: [certificates]
      summary: Cấp chứng chỉ cho học viên
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCertificateBody"
      responses:
        "201":
          description: Certificate issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateRecord"

  /certificates/{classId}/{studentId}:
    put:
      operationId: updateCertificate
      tags: [certificates]
      summary: Cập nhật thông tin chứng chỉ
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCertificateBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateRecord"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DashboardSummary:
      type: object
      properties:
        totalCourses:
          type: integer
        totalClasses:
          type: integer
        totalStudents:
          type: integer
        totalInstructors:
          type: integer
        recentClasses:
          type: array
          items:
            $ref: "#/components/schemas/ClassWithDetails"
      required:
        - totalCourses
        - totalClasses
        - totalStudents
        - totalInstructors
        - recentClasses

    Course:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        content:
          type: string
        duration:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - content
        - duration
        - createdAt

    CreateCourseBody:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
        duration:
          type: string
      required:
        - name
        - content
        - duration

    ClassWithDetails:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        courseId:
          type: integer
        courseName:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        studentCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - courseId
        - courseName
        - startDate
        - endDate
        - studentCount
        - createdAt

    CreateClassBody:
      type: object
      properties:
        name:
          type: string
        courseId:
          type: integer
        startDate:
          type: string
        endDate:
          type: string
      required:
        - name
        - courseId
        - startDate
        - endDate

    Session:
      type: object
      properties:
        id:
          type: integer
        classId:
          type: integer
        sessionDate:
          type: string
        sessionPeriod:
          type: string
        lessonCount:
          type: integer
        content:
          type: string
        instructorId:
          type: integer
        instructorName:
          type: string
        mediaUrls:
          type: array
          items:
            type: string
        createdAt:
          type: string
      required:
        - id
        - classId
        - sessionDate
        - sessionPeriod
        - lessonCount
        - content
        - createdAt

    CreateSessionBody:
      type: object
      properties:
        sessionDate:
          type: string
        sessionPeriod:
          type: string
        lessonCount:
          type: integer
        content:
          type: string
        instructorId:
          type: integer
        mediaUrls:
          type: array
          items:
            type: string
      required:
        - sessionDate
        - sessionPeriod
        - lessonCount
        - content

    ClassStudentDetail:
      type: object
      properties:
        studentId:
          type: integer
        studentCode:
          type: string
        fullName:
          type: string
        photoUrl:
          type: string
        testScore:
          type: string
        grade:
          type: string
        instructorId:
          type: integer
        supervisorName:
          type: string
      required:
        - studentId
        - studentCode
        - fullName

    BulkUpdateStudentsBody:
      type: object
      properties:
        students:
          type: array
          items:
            type: object
            properties:
              studentId:
                type: integer
              testScore:
                type: string
              grade:
                type: string
              instructorId:
                type: integer
            required:
              - studentId
      required:
        - students

    StudentWithDetails:
      type: object
      properties:
        id:
          type: integer
        studentCode:
          type: string
        fullName:
          type: string
        dateOfBirth:
          type: string
        idNumber:
          type: string
        idIssueDate:
          type: string
        idIssuePlace:
          type: string
        workplace:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        photoUrl:
          type: string
        instructorId:
          type: integer
        instructorName:
          type: string
        classId:
          type: integer
        className:
          type: string
        createdAt:
          type: string
      required:
        - id
        - studentCode
        - fullName
        - createdAt

    CreateStudentBody:
      type: object
      properties:
        studentCode:
          type: string
        fullName:
          type: string
        dateOfBirth:
          type: string
        idNumber:
          type: string
        idIssueDate:
          type: string
        idIssuePlace:
          type: string
        workplace:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        photoUrl:
          type: string
        instructorId:
          type: integer
        classId:
          type: integer
      required:
        - studentCode
        - fullName

    Instructor:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        academicTitle:
          type: string
        position:
          type: string
        specialization:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
        createdAt:
          type: string
      required:
        - id
        - fullName
        - createdAt

    CreateInstructorBody:
      type: object
      properties:
        fullName:
          type: string
        academicTitle:
          type: string
        position:
          type: string
        specialization:
          type: string
        email:
          type: string
        phone:
          type: string
        notes:
          type: string
      required:
        - fullName

    CertificateStudentDetail:
      type: object
      properties:
        studentId:
          type: integer
        studentCode:
          type: string
        fullName:
          type: string
        dateOfBirth:
          type: string
        courseName:
          type: string
        hasCertificate:
          type: boolean
        issueDate:
          type: string
        expiryDate:
          type: string
        instructorId:
          type: integer
        printLocation:
          type: string
        locationLink:
          type: string
      required:
        - studentId
        - studentCode
        - fullName
        - hasCertificate

    CertificateRecord:
      type: object
      properties:
        studentId:
          type: integer
        classId:
          type: integer
        studentCode:
          type: string
        fullName:
          type: string
        className:
          type: string
        issueDate:
          type: string
        expiryDate:
          type: string
        instructorId:
          type: integer
        instructorName:
          type: string
        printLocation:
          type: string
        locationLink:
          type: string
        issuedAt:
          type: string
      required:
        - studentId
        - classId
        - studentCode
        - fullName
        - className

    IssueCertificateBody:
      type: object
      properties:
        studentId:
          type: integer
        issueDate:
          type: string
        expiryDate:
          type: string
        instructorId:
          type: integer
        printLocation:
          type: string
        locationLink:
          type: string
      required:
        - studentId

    UpdateCertificateBody:
      type: object
      properties:
        issueDate:
          type: string
        expiryDate:
          type: string
